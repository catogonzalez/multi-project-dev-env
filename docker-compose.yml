version: '3.8'

services:
  api:
    build:
      context: ../api-project  # Path to your API project directory
    volumes:
      - ../api-project:/app  # Map your local code for hot reloading
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db.dev.local:5432/postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.dev.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"  # Your API service port
      # Add HTTPS support
      - "traefik.http.routers.api-secure.rule=Host(`api.dev.local`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
    networks:
      - traefik-public

  web:
    build:
      context: ../web-project  # Path to your web project directory
    volumes:
      - ../web-project:/app  # Map your local code for hot reloading
    environment:
      - API_URL=http://api.dev.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`web.dev.local`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=8000"  # Your web service port
      # Add HTTPS support
      - "traefik.http.routers.web-secure.rule=Host(`web.dev.local`)"
      - "traefik.http.routers.web-secure.entrypoints=websecure"
      - "traefik.http.routers.web-secure.tls=true"
    networks:
      - traefik-public

  mobile:
    build:
      context: ../mobile-project  # Path to your mobile project directory
    volumes:
      - ../mobile-project:/app  # Map your local code for hot reloading
    environment:
      - API_URL=http://api.dev.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mobile.rule=Host(`mobile.dev.local`)"
      - "traefik.http.routers.mobile.entrypoints=web"
      - "traefik.http.services.mobile.loadbalancer.server.port=19000"  # Your mobile service port (e.g., Expo)
      # Add HTTPS support
      - "traefik.http.routers.mobile-secure.rule=Host(`mobile.dev.local`)"
      - "traefik.http.routers.mobile-secure.entrypoints=websecure"
      - "traefik.http.routers.mobile-secure.tls=true"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
